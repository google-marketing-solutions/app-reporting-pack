; Only kebab-style setting names are supported (no underscores)
[config]
  name = arp
  config-file = app_reporting_pack.yaml

[repository]
  name = docker
  image = $NAME
  location = europe

[cloud-run]
  name = $NAME
  region = europe-west1
  cpu = 2
  memory = 8Gi
  task-timeout = 24h
  ; leave service-account blank to reuse the default compute SA (zero extra steps),
  ; or set a dedicated least-privilege SA:
  ; service-account = $NAME-run@$PROJECT_ID.iam.gserviceaccount.com
  service-account =

[scheduler]
  name = $NAME
  schedule = 0 0 * * *
;  schedule-timezone = Etc/UTC
  region = europe-west1
